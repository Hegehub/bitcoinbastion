apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bitcoin-bastion-secrets
  namespace: bitcoin-bastion
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: your-secret-store
  target:
    name: bitcoin-bastion-secrets
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: /bitcoin-bastion/DATABASE_URL}
    - secretKey: REDIS_URL
      remoteRef: {key: /bitcoin-bastion/REDIS_URL}
    - secretKey: JWT_SECRET_KEY
      remoteRef: {key: /bitcoin-bastion/JWT_SECRET_KEY}
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef: {key: /bitcoin-bastion/TELEGRAM_BOT_TOKEN}
    - secretKey: BOT_API_BEARER_TOKEN
      remoteRef: {key: /bitcoin-bastion/BOT_API_BEARER_TOKEN}
    - secretKey: BITCOIN_ESPLORA_URL
      remoteRef: {key: /bitcoin-bastion/BITCOIN_ESPLORA_URL}
