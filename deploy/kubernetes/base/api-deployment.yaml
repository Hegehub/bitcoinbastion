apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-bastion-api
  namespace: bitcoin-bastion
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bitcoin-bastion-api
  template:
    metadata:
      labels:
        app: bitcoin-bastion-api
    spec:
      serviceAccountName: bitcoin-bastion
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/your-org/bitcoin-bastion:latest
          imagePullPolicy: IfNotPresent
          command: ["bash", "scripts/start_api.sh"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: bitcoin-bastion-config
            - secretRef:
                name: bitcoin-bastion-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
