apiVersion: v1
kind: Secret
metadata:
  name: bitcoin-bastion-secrets
  namespace: bitcoin-bastion
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://user:password@postgres:5432/bitcoin_bastion"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET_KEY: "replace-with-long-random-secret-at-least-32-characters"
  TELEGRAM_BOT_TOKEN: "replace-me"
  BOT_API_BEARER_TOKEN: "replace-me"
  BITCOIN_ESPLORA_URL: "https://blockstream.info/api"
  # Example placeholders only. Use ExternalSecret/SealedSecret/secret manager in real environments.
  OBJECT_STORAGE_ACCESS_KEY: "replace-with-object-storage-access-key"
  OBJECT_STORAGE_SECRET_KEY: "replace-with-object-storage-secret-key"
