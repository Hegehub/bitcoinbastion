apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-postgres-migration-smoke
  namespace: bitcoin-bastion
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: bitcoin-bastion-postgres-migration-smoke
    spec:
      serviceAccountName: bitcoin-bastion
      restartPolicy: Never
      containers:
        - name: postgres-migration-smoke
          image: ghcr.io/your-org/bitcoin-bastion:latest
          command: ["python", "scripts/run_postgres_migration_smoke.py", "--output-json", "/tmp/artifacts/postgres_migration_smoke.json"]
          envFrom:
            - configMapRef: {name: bitcoin-bastion-config}
            - secretRef: {name: bitcoin-bastion-secrets}
          env:
            - name: POSTGRES_TEST_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bitcoin-bastion-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: artifacts
              mountPath: /tmp/artifacts
      volumes:
        - name: artifacts
          emptyDir: {}
