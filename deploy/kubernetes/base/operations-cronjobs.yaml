apiVersion: batch/v1
kind: CronJob
metadata:
  name: bitcoin-bastion-news-fetch
  namespace: bitcoin-bastion
  annotations:
    operations.bitcoinbastion.io/job-name: "news.fetch"
    operations.bitcoinbastion.io/legacy-name: "bitcoin-bastion-news-fetch"
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: bitcoin-bastion
          restartPolicy: Never
          containers:
            - name: job
              image: ghcr.io/your-org/bitcoin-bastion:latest
              command: ["python", "-m", "app.tasks.news_tasks"]
              env:
                - name: BASTION_JOB_NAME
                  value: "news.fetch"
              envFrom:
                - configMapRef: {name: bitcoin-bastion-config}
                - secretRef: {name: bitcoin-bastion-secrets}
---
