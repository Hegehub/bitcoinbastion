apiVersion: v1
kind: ConfigMap
metadata:
  name: bitcoin-bastion-config
  namespace: bitcoin-bastion
data:
  ENVIRONMENT: "staging"
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"
  LOG_LEVEL: "info"
  STORAGE_PROFILE: "staging"
  STORAGE_HEALTH_ENABLED: "true"
  STORAGE_DEGRADED_MODE_ENABLED: "true"
  STORAGE_FAIL_FAST_ON_CRITICAL_MISSING: "true"
  OBJECT_STORAGE_ENABLED: "true"
  OBJECT_STORAGE_PROVIDER: "s3"
  OBJECT_STORAGE_BACKEND: "s3"
  OBJECT_STORAGE_ENDPOINT: "https://s3-compatible.example.com"
  OBJECT_STORAGE_PUBLIC_ENDPOINT: ""
  OBJECT_STORAGE_BUCKET: "bitcoin-bastion-artifacts"
  OBJECT_STORAGE_REGION: "replace-me"
  OBJECT_STORAGE_USE_SSL: "true"
  OBJECT_STORAGE_SECURE: "true"
  OBJECT_STORAGE_FORCE_PATH_STYLE: "false"
  OBJECT_STORAGE_DEFAULT_RETENTION_DAYS: "365"
  OBJECT_STORAGE_EVIDENCE_RETENTION_DAYS: "2555"
  OBJECT_STORAGE_MAX_ARTIFACT_BYTES: "104857600"
  OBJECT_STORAGE_MAX_OBJECT_BYTES: "104857600"
  TIMESCALE_ENABLED: "false"
  CLICKHOUSE_ENABLED: "false"
  QDRANT_ENABLED: "false"
