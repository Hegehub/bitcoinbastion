# Example only: local/self-host/single-node MinIO for Bitcoin Bastion artifact storage.
# Not recommended as the default production object storage. Prefer managed or hardened
# S3-compatible storage for staging/production.
# Object Storage must never contain seed phrases, Bitcoin private keys, wallet files,
# xprv/yprv/zprv, raw Access Pass bearer tokens, raw API secrets, or unredacted sensitive material.
apiVersion: v1
kind: Secret
metadata:
  name: bitcoin-bastion-minio-example-secrets
  namespace: bitcoin-bastion
type: Opaque
stringData:
  MINIO_ROOT_USER: "replace-me"
  MINIO_ROOT_PASSWORD: "replace-me"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bitcoin-bastion-minio-data
  namespace: bitcoin-bastion
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-bastion-minio-example
  namespace: bitcoin-bastion
  labels:
    app: bitcoin-bastion-minio-example
    app.kubernetes.io/part-of: bitcoin-bastion
    storage.bitcoinbastion.io/example-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bitcoin-bastion-minio-example
  template:
    metadata:
      labels:
        app: bitcoin-bastion-minio-example
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          envFrom:
            - secretRef:
                name: bitcoin-bastion-minio-example-secrets
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 30
            timeoutSeconds: 3
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bitcoin-bastion-minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: bitcoin-bastion-minio-example
  namespace: bitcoin-bastion
  labels:
    storage.bitcoinbastion.io/example-only: "true"
spec:
  selector:
    app: bitcoin-bastion-minio-example
  ports:
    - name: api
      port: 9000
      targetPort: api
    - name: console
      port: 9001
      targetPort: console
