apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitcoin-bastion-api
  namespace: bitcoin-bastion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitcoin-bastion-worker
  namespace: bitcoin-bastion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitcoin-bastion-beat
  namespace: bitcoin-bastion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitcoin-bastion-migration
  namespace: bitcoin-bastion
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bitcoin-bastion-evidence
  namespace: bitcoin-bastion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bitcoin-bastion-read-pods-jobs
  namespace: bitcoin-bastion
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bitcoin-bastion-evidence-read
  namespace: bitcoin-bastion
subjects:
  - kind: ServiceAccount
    name: bitcoin-bastion-evidence
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bitcoin-bastion-read-pods-jobs
