apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bitcoin-bastion-emergency-lockdown
  namespace: bitcoin-bastion
  annotations:
    mode: "apply-only-during-incident"
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - {protocol: TCP, port: 5432}
        - {protocol: TCP, port: 6379}
