apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-backup-verification
  namespace: bitcoin-bastion
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: postgres:16
          command: ["/bin/sh","-c","set -eu; echo verify backup artifact exists/checksum/size and log evidence"]
