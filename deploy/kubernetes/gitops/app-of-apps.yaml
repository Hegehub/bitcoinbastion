apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bitcoin-bastion-app-of-apps
  namespace: argocd
spec:
  project: bitcoin-bastion
  source:
    repoURL: https://github.com/Hegehub/bitcoinbastion.git
    targetRevision: main
    path: deploy/kubernetes/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
