apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-evidence-verify
  namespace: bitcoin-bastion
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: ghcr.io/your-org/bitcoin-bastion:latest
          command: ["/bin/sh","-c","set -eu; for f in release_evidence.json postgres_migration_smoke.json postgres_schema_parity.json; do test -s /evidence/$f; done; echo Evidence verified"]
          volumeMounts:
            - name: evidence
              mountPath: /evidence
      volumes:
        - name: evidence
          emptyDir: {}
