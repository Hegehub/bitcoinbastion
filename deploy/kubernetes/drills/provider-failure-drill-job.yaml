apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-provider-failure-drill
  namespace: bitcoin-bastion
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provider-drill
          image: ghcr.io/your-org/bitcoin-bastion:latest
          command: ["/bin/sh","-c","echo provider_failure_drill_start; curl -fsS http://bitcoin-bastion-api:8000/api/v1/observability/snapshot || true; echo provider_failure_drill_end"]
