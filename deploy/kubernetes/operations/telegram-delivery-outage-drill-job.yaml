apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-telegram-delivery-outage-drill
  namespace: bitcoin-bastion
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: delivery-outage-drill
          image: ghcr.io/your-org/bitcoin-bastion:latest
          env:
            - name: DELIVERY_DRY_RUN
              value: "1"
          command: ["/bin/sh","-c","echo delivery_outage_drill_dry_run_start; curl -fsS http://bitcoin-bastion-api:8000/api/v1/observability/snapshot || true; echo verify_retry_idempotency_duplicate_suppression_guidance; echo delivery_outage_drill_dry_run_end"]
