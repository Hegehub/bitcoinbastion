apiVersion: batch/v1
kind: Job
metadata:
  name: bitcoin-bastion-provider-outage-drill
  namespace: bitcoin-bastion
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: provider-outage-drill
          image: ghcr.io/your-org/bitcoin-bastion:latest
          command: ["/bin/sh","-c","echo provider_outage_drill_dry_run_start; curl -fsS http://bitcoin-bastion-api:8000/api/v1/observability/snapshot || true; echo verify_fallback_confidence_degraded_and_alert_candidates; echo provider_outage_drill_dry_run_end"]
