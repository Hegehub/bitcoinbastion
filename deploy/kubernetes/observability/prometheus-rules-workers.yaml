apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: bitcoin-bastion-workers, namespace: bitcoin-bastion}
spec:
  groups:
    - name: workers
      rules:
        - alert: WorkerUnavailable
          expr: min(up{job=~".*worker.*"}) < 1
          for: 10m
          labels: {severity: warning}
        - alert: RecoveryDrillCronFailing
          expr: kube_job_status_failed{namespace=~"bitcoin-bastion.*",job_name=~".*recovery.*"} > 0
          for: 10m
          labels: {severity: warning}
