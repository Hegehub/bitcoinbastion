apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bitcoin-bastion-wallet-lnurl-alerts
  namespace: bitcoin-bastion
spec:
  groups:
    - name: wallet-lnurl-security
      rules:
        - alert: BastionLNURLK1ReplaySpike
          expr: sum(rate(lnurl_auth_k1_events_total{event="replay_detected"}[5m])) > 0.1
          for: 5m
          labels: {severity: high}
          annotations: {summary: "LNURL k1 replay rate is elevated"}
        - alert: BastionWalletProofRejectionSpike
          expr: sum(rate(wallet_auth_proofs_total{result=~"rejected|failed"}[10m])) > 0.5
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Wallet proof rejection rate is elevated"}
        - alert: BastionPolicyDenialSpike
          expr: sum(rate(bastion_access_policy_decisions_total{decision="deny"}[10m])) > 1
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "Access Policy denial rate is elevated"}
        - alert: BastionLNURLPaymentVerificationFailures
          expr: sum(rate(lnurl_verify_total{result="failed"}[10m])) > 0.1
          for: 10m
          labels: {severity: warning}
          annotations: {summary: "LNURL settlement verification failures detected"}
        - alert: BastionWithdrawPolicyDenialSpike
          expr: sum(rate(lnurl_withdraw_requests_total{result="denied"}[10m])) > 0.1
          for: 10m
          labels: {severity: high}
          annotations: {summary: "LNURL withdraw policy denials elevated"}
