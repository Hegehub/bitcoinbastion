apiVersion: apps/v1
kind: Deployment
metadata: {name: bitcoin-bastion-api}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/bitcoin-bastion@sha256:replace-with-approved-digest
          env: [{name: ENVIRONMENT, value: "dev"}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bitcoin-bastion-worker}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/bitcoin-bastion@sha256:replace-with-approved-digest
          env: [{name: ENVIRONMENT, value: "dev"}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: bitcoin-bastion-beat}
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: beat
          image: ghcr.io/your-org/bitcoin-bastion@sha256:replace-with-approved-digest
          env: [{name: ENVIRONMENT, value: "dev"}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: bitcoin-bastion}
spec:
  rules:
    - host: bitcoin-bastion-dev.example.com
