apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bitcoin-bastion
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bitcoin-bastion-k3s.example.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bitcoin-bastion-api
                port:
                  number: 8000
