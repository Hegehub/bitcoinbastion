apiVersion: v1
kind: ConfigMap
metadata:
  name: bitcoin-bastion-config
data:
  ENVIRONMENT: "k3s"
  RUNTIME_PROFILE: "k3s"
  BB_RUNTIME_PROFILE: "k3s"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-bastion-api
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: ENVIRONMENT
              value: "k3s"
            - name: RUNTIME_PROFILE
              value: "k3s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-bastion-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: ENVIRONMENT
              value: "k3s"
            - name: RUNTIME_PROFILE
              value: "k3s"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bitcoin-bastion-beat
spec:
  template:
    spec:
      containers:
        - name: beat
          env:
            - name: ENVIRONMENT
              value: "k3s"
            - name: RUNTIME_PROFILE
              value: "k3s"
