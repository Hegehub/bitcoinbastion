version: 1
canonical_kubernetes_path: deploy/kubernetes
kubernetes_required_for_all_profiles: false
cloud_provider_required: false
custody_allowed: false
seed_phrase_handling_allowed: false
private_key_handling_allowed: false
profiles:
  - compose
  - k8s
  - k3s
  - kind
  - minikube
  - single-node
  - bare-metal-systemd
future_reserved_profiles:
  - podman-compose
  - nomad
  - talos
notes:
  - Runtime profiles are metadata and operator guidance, not proof of production readiness.
  - Kubernetes is supported but not mandatory.

overlay_paths:
  kind: deploy/kubernetes/overlays/kind
  minikube: deploy/kubernetes/overlays/minikube
  k3s: deploy/kubernetes/overlays/k3s
  single-node: deploy/kubernetes/overlays/single-node
frontend_modes:
  api-only:
    mode: api-only
    primary: none
    nextjs_enabled: false
    reflex_enabled: false
    cutover_ready: false
    rollback_available: false
    compose_file: docker-compose.yml
    notes:
      - FastAPI backend/API only; useful for SDK and API deployments.
  reflex:
    mode: reflex
    primary: reflex
    nextjs_enabled: false
    reflex_enabled: true
    cutover_ready: true
    rollback_available: false
    compose_file: deploy/compose/full-reflex.compose.yaml
    notes:
      - Reflex is the preferred primary migration entrypoint after Prompt 21/22; legacy Next.js has been removed; rollback requires Git restore.
