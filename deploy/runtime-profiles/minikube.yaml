name: minikube
runtime_type: minikube
status: overlay-added
best_for:
  - local operator testing
  - local ingress testing
  - developer demos
recommended_envs:
  - local
min_cpu: 2
min_ram: 4Gi
ha_supported: false
evidence_supported: local-only
k8s_required: true
production_suitability: none
production_suitable: false
resource_footprint: medium
operational_complexity: low-to-medium
operational_risk: low-for-local-testing-only
requires_cloud_provider: false
supports_air_gapped: true
supports_local_only: true
canonical_paths:
  - deploy/runtime-profiles/minikube.yaml
  - deploy/kubernetes
  - deploy/kubernetes/overlays/minikube
commands:
  - kubectl kustomize deploy/kubernetes/overlays/minikube
limitations:
  - local testing only
  - not production-ready
  - no production evidence
  - no HA
  - no production TLS/WAF/CDN evidence
  - no disaster recovery evidence
security_notes:
  - Do not use Minikube as a production runtime.
  - Do not store real secrets in local examples or profile metadata.
evidence_notes:
  - Evidence is local-only and does not prove production readiness.
future_extensions:
  - Future local operator demos may add non-secret smoke evidence collection.
