name: Reflex Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reflex-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reflex_frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy bastion_ui
      - name: Pytest
        run: uv run pytest
      - name: Reflex export
        run: uv run reflex export
