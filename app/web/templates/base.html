<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Bitcoin Bastion Market Time Machine{% endblock %}</title>
  <!-- HTMX/Alpine-compatible markup is used without requiring CDN assets for self-hosted rendering. -->
  <style>
    :root { --bb-orange:#f7931a; --bb-black:#111827; --bb-graphite:#374151; --bb-muted:#6b7280; --bb-bg:#fffaf2; --bb-panel:#ffffff; --bb-border:#e5e7eb; --bb-green:#15803d; --bb-red:#b91c1c; --bb-yellow:#a16207; --focus:#2563eb; }
    @media (prefers-color-scheme: dark) { :root { --bb-bg:#111827; --bb-panel:#1f2937; --bb-black:#f9fafb; --bb-graphite:#d1d5db; --bb-muted:#9ca3af; --bb-border:#374151; } }
    * { box-sizing: border-box; } body { margin:0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--bb-black); background:var(--bb-bg); line-height:1.5; }
    a { color:inherit; } a:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline:3px solid var(--focus); outline-offset:3px; }
    .site-header, .site-footer { border-bottom:1px solid var(--bb-border); background:var(--bb-panel); } .site-footer { border-top:1px solid var(--bb-border); border-bottom:0; margin-top:2rem; }
    .container { max-width:1180px; margin:0 auto; padding:1rem; } .header-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
    .brand { font-weight:800; text-decoration:none; } .nav { display:flex; gap:1rem; flex-wrap:wrap; } .nav a { text-decoration:none; color:var(--bb-graphite); }
    .hero { padding:1.5rem 0; } .eyebrow { color:var(--bb-orange); font-weight:700; text-transform:uppercase; letter-spacing:.08em; font-size:.8rem; } h1 { font-size:clamp(1.8rem, 4vw, 3rem); line-height:1.1; margin:.25rem 0; } h2 { margin:.1rem 0 .8rem; }
    .grid { display:grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap:1rem; align-items:start; } .stack { display:grid; gap:1rem; }
    .panel, .chart-card, .safety, .timeline-item { background:var(--bb-panel); border:1px solid var(--bb-border); border-radius:18px; padding:1rem; box-shadow:0 1px 2px rgba(17,24,39,.04); }
    .safety { border-color:rgba(247,147,26,.35); } .safety ul { margin:.5rem 0 0; padding-left:1.2rem; color:var(--bb-graphite); }
    .controls, .chart-toolbar, .actions, .timeline-filters, .history-nav { display:flex; gap:.65rem; align-items:center; flex-wrap:wrap; } .controls input, .controls select, .controls button, .actions a, .actions button, .timeframe, .timeline-filters a { border:1px solid var(--bb-border); border-radius:999px; background:var(--bb-panel); color:var(--bb-black); padding:.45rem .75rem; text-decoration:none; font:inherit; }
    .active, .actions a.primary { background:var(--bb-orange); color:white; border-color:var(--bb-orange); } .chart-shell { overflow-x:auto; min-height:320px; border:1px dashed var(--bb-border); border-radius:16px; padding:1rem; background:linear-gradient(180deg, rgba(247,147,26,.06), transparent); }
    .chart-controls { display:flex; gap:.5rem; margin-bottom:1rem; } .chart-controls button { border:1px solid var(--bb-border); background:var(--bb-panel); border-radius:10px; padding:.35rem .6rem; }
    .candles { min-width:760px; height:190px; display:flex; align-items:end; gap:.45rem; padding:1rem 0; border-bottom:1px solid var(--bb-border); }
    .candle { width:18px; min-height:24px; display:flex; align-items:center; justify-content:center; position:relative; text-decoration:none; } .candle .wick { position:absolute; width:2px; height:120%; background:currentColor; opacity:.8; } .candle .body { position:absolute; width:14px; height:70%; border-radius:4px; background:currentColor; } .candle.up { color:var(--bb-green); } .candle.down { color:var(--bb-red); } .candle-meta { position:absolute; top:100%; font-size:.65rem; color:var(--bb-muted); margin-top:.25rem; }
    .marker-row { min-width:760px; display:flex; gap:.3rem; flex-wrap:wrap; padding-top:1rem; } .marker { border:1px solid var(--bb-border); background:var(--bb-panel); border-radius:999px; min-width:34px; min-height:34px; cursor:pointer; } .marker-security { border-color:var(--bb-red); } .marker-regulatory, .marker-institutional { border-color:var(--bb-orange); } .marker-positive { border-color:var(--bb-green); } .marker-negative { border-color:var(--bb-red); }
    .timeline-list { display:grid; gap:.75rem; } .timeline-item { display:grid; gap:.45rem; } .timeline-item header { display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; } .badge { display:inline-flex; align-items:center; border:1px solid var(--bb-border); border-radius:999px; padding:.15rem .5rem; font-size:.8rem; color:var(--bb-graphite); }
    .metrics { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:.5rem; } .metrics div { border:1px solid var(--bb-border); border-radius:12px; padding:.6rem; } dt { color:var(--bb-muted); font-size:.8rem; } dd { margin:0; font-weight:700; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; overflow-wrap:anywhere; }
    .empty-state, .error-state { border:1px dashed var(--bb-border); border-radius:14px; padding:1rem; color:var(--bb-muted); } .error-state { color:var(--bb-red); }
    .skeleton-line { height:14px; background:var(--bb-border); border-radius:999px; margin:.7rem 0; opacity:.7; } .skeleton-line.short { width:55%; } .muted { color:var(--bb-muted); }
    @media (max-width: 820px) { .grid { grid-template-columns:1fr; } .container { padding:.8rem; } .panel, .chart-card, .safety, .timeline-item { border-radius:14px; } .candles, .marker-row { min-width:620px; } .metrics { grid-template-columns:1fr; } .timeline-item header { display:block; } }
  </style>
  <link rel="stylesheet" href="/static/css/market.css">
</head>
<body>
  <header class="site-header"><div class="container header-row"><a class="brand" href="/market">Bitcoin Bastion</a><nav class="nav" aria-label="Primary web navigation"><a href="/market">Market Intelligence</a><a href="/market/timeline">Timeline</a><a href="/market/time-machine">Market Time Machine</a><a href="/market/narratives">Narratives</a><a href="/market/signals">Signals</a><a href="/market/evidence">Evidence</a><a href="/market/sources">Sources</a><a href="/api/v1/public/status">Status API</a></nav></div></header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="site-footer"><div class="container"><p class="muted">Evidence over claims. Operator control. No custody. Self-hosted compatible.</p></div></footer>
</body>
</html>
