[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-bastion"
version = "0.1.0"
description = "Bitcoin-native intelligence and operations platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "psycopg[binary]>=3.2.0",
  "redis>=5.0.8",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.4",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "feedparser>=6.0.11",
  "aiogram>=3.13.1",
  "celery>=5.4.0",
  "passlib[argon2]>=1.7.4",
  "python-jose>=3.3.0",
  "email-validator>=2.2.0",
  "prometheus-client>=0.22.0",
  "jinja2>=3.1.4",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "websockets>=12.0",
  "clickhouse-connect>=0.8.0",
  "cryptography>=42.0.0",
  "bolt11>=2.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "factory-boy>=3.3.0",
  "black>=24.8.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
]

[project.scripts]
bastion = "cli.bastion_cli.main:app"

[tool.pytest.ini_options]
pythonpath = [".", "sdk/python"]
norecursedirs = ["frontend"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false


[tool.setuptools.packages.find]
where = [".", "sdk/python"]
include = ["app*", "cli*", "bitcoin_bastion_sdk*"]

[[tool.mypy.overrides]]
module = "cli.*"
disallow_untyped_decorators = false
