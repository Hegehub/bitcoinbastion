apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup-placeholder
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: alpine:3.20
              command: ["sh", "-c", "echo backup placeholder"]
