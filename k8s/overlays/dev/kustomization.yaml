apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: Deployment, name: frontend}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target: {kind: ConfigMap, name: app-config}
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
      - op: replace
        path: /data/DEBUG
        value: "true"
