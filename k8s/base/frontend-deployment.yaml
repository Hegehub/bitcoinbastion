apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app: frontend}
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/hegehub/bitcoinbastion-frontend:latest
          ports: [{containerPort: 3000}]
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              valueFrom: {configMapKeyRef: {name: app-config, key: NEXT_PUBLIC_API_BASE_URL}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "400m", memory: "256Mi"}
