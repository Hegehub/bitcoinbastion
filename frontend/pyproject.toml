[project]
name = "bitcoin-bastion-reflex-frontend"
version = "0.1.0"
description = "Primary Reflex frontend for Bitcoin Bastion"
requires-python = ">=3.12"
dependencies = [
    "reflex",
    "httpx",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "cryptography>=44,<47",
    "segno>=1.6.1,<2",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "ruff",
    "mypy",
    "axe-playwright-python",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["bastion_ui/tests"]
pythonpath = ["."]
addopts = "-q"
